<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CityBus Demo – Ticket App</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#21964f">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{--bg:#fbf6f4;--card:#fff;--tile:#dff0fb;--ink:#161616;--mute:#777;--g:#21964f;--r:#c8262d;--line:#e3e3e3;--tk:#a98bd6;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17191b;--card:#222628;--tile:#1f3441;--ink:#f1f1f1;--mute:#9aa;--line:#3a3f42;color-scheme:dark}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:#cfd4d8;font-family:Roboto,"Segoe UI",system-ui,sans-serif;color:var(--ink);display:flex;justify-content:center}
#app{width:100%;max-width:430px;height:100%;background:var(--bg);position:relative;overflow:hidden;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;background:var(--card);border-bottom:1px solid var(--line)}
.logo{width:40px;height:40px;border-radius:50%;background:#fff;border:2px solid var(--g);display:grid;place-items:center;font-weight:700;font-size:11px;color:var(--g)}
.demo-bar{background:#fff3cd;color:#6b4e00;font-size:12px;text-align:center;padding:4px}
main{flex:1;overflow-y:auto;padding:12px 12px 20px}
.search{background:var(--card);border-radius:14px;padding:6px}
.search div{background:#e6e6e6;color:#444;border-radius:30px;padding:13px 18px;font-size:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:18px 4px 12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:0 4px}
.tile{background:none;border:0;font:inherit;color:inherit;text-align:center;cursor:pointer;padding:0}
.tile i{display:grid;place-items:center;background:var(--tile);border-radius:10px;height:64px;font-style:normal;font-size:26px;box-shadow:0 2px 4px #0002;margin-bottom:6px}
.grid2 .tile i{height:78px}
.tile:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--g);outline-offset:2px}
h3{margin:22px 4px 8px;font-size:18px;display:flex;justify-content:space-between}
.stop{background:var(--card);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.stop .t{background:#e8e8e8;color:#222;padding:10px 12px;display:flex;justify-content:space-between}
.stop .row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-top:1px solid var(--line)}
.stop .no{background:#eee;color:#111;font-weight:700;border-radius:6px;padding:12px 18px;min-width:62px;text-align:center}
.stop .eta{margin-left:auto;color:var(--g);font-weight:600}
.map{background:linear-gradient(135deg,#dbe4ea,#cfdbd2);border-radius:8px;height:150px;position:relative;overflow:hidden}
.map b{position:absolute;background:var(--g);color:#fff;font-size:10px;padding:2px 5px;border-radius:3px}
nav{display:flex;border-top:1px solid var(--line);background:var(--card)}
nav button{flex:1;border:0;background:none;padding:10px;font:inherit;font-size:13px;color:var(--mute);cursor:pointer}
nav button.on{color:var(--ink);font-weight:700}
.top{display:flex;align-items:center;gap:14px;padding:12px 14px;background:var(--card)}
.top button{border:0;background:none;font-size:22px;color:var(--ink);cursor:pointer}
.top span{margin-left:auto;color:var(--mute)}
.tkt{margin:12px;background:#fafafa;color:#222;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.tkt .h{background:var(--g);color:#fff;padding:12px 14px;font-size:14px}
.tkt .b{padding:14px}
label{display:block;font-size:13px;color:#666;margin:12px 0 4px}
select{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff;color:#222}
.seg{display:flex;gap:10px;margin:16px 0 4px}
.seg button{flex:1;padding:12px;border-radius:8px;border:1px solid var(--line);background:#fff;font:inherit;cursor:pointer;color:#222}
.seg .on{background:var(--g);color:#fff;border-color:var(--g)}
.qty{display:flex;justify-content:space-between;align-items:center;margin:10px 0}
.qty div{display:flex;gap:8px;align-items:center}
.qty button{width:38px;height:38px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:18px;cursor:pointer;color:#222}
.qty output{min-width:44px;text-align:center;border:1px solid var(--line);border-radius:8px;padding:8px;background:#fff}
.price{font-size:20px;font-weight:700;margin-top:10px;color:#222}
.pay{margin:12px;padding:15px;background:var(--g);color:#fff;border:0;border-radius:8px;font:700 18px inherit;cursor:pointer;width:calc(100% - 24px)}
.pay:disabled{opacity:.45;cursor:not-allowed}
.tv{background:var(--tk);min-height:100%;margin:-12px -12px -20px;padding:14px}
.tvt{display:flex;justify-content:space-between;font-size:14px;text-decoration:underline;color:#222;margin-bottom:14px}
.card{background:#f6f6f6;color:#222;border-radius:14px;overflow:hidden;position:relative}
.card .hd{background:var(--r);color:#fff;text-align:center;padding:12px;font-size:18px;font-weight:700}
.card .bd{padding:14px 16px}
.f{display:flex;justify-content:space-between;color:#777;font-size:13px}
.f+.f{margin-top:2px}.big{font-size:22px;font-weight:700;color:#111}
.path{display:flex;justify-content:space-around;align-items:center;font-size:18px;margin:16px 0}
.sep{border-top:1px dashed #ccc;margin:14px -16px}
.stamp{width:190px;height:190px;margin:10px auto;display:grid;place-items:center}
.stamp svg{width:100%;height:100%;animation:pop 2.2s ease-in-out infinite}
@keyframes pop{0%,100%{transform:scale(.72)}50%{transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){.stamp svg{animation:none}}
.wm{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;font-size:34px;font-weight:800;color:#c8262d1c;transform:rotate(-20deg);text-align:center}
.exp{text-align:center;color:#555;font-size:14px}
.qrb{margin-top:14px;width:100%;padding:14px;border-radius:8px;border:0;background:#bfe6d3;color:#175c3a;font:600 16px inherit;cursor:pointer}
.modal{position:absolute;inset:0;background:#000a;display:grid;place-items:center;z-index:5}
.modal div{background:#fff;color:#222;padding:16px;border-radius:8px;text-align:center;max-width:300px}
.list .it{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;display:flex;justify-content:space-between;cursor:pointer}
.empty{text-align:center;color:var(--mute);margin-top:60px}
</style></head><body><div id="app"></div>
<script>
const ROUTES={
 "5":{to:"Pune Station",stops:["Nana Peth","Ganesh Peth","Kasba Peth","Budhwar Peth","Shaniwar Wada","Deccan","Pune Station"]},
 "174":{to:"Moledina Stand",stops:["Karve Nagar","Alka Talkies","Deccan","Ganesh Peth","Swargate","Moledina Stand"]},
 "202":{to:"Ganpati Matha",stops:["Alpana Talkies","Warje","Karve Nagar","Kothrud Depot","Ganpati Matha"]}
};
const S={tab:"home",view:"home",route:"",from:"",to:"",mode:"stop",full:1,half:0,tickets:[],sel:null,timer:null,secs:300};
try{S.tickets=JSON.parse(localStorage.getItem("cb_tix")||"[]")}catch(e){}
const save=()=>{try{localStorage.setItem("cb_tix",JSON.stringify(S.tickets))}catch(e){}};
const $=s=>document.querySelector(s),app=$("#app");
const fareOf=()=>{const st=ROUTES[S.route]?.stops;if(!st||!S.from||!S.to)return 0;const n=Math.abs(st.indexOf(S.to)-st.indexOf(S.from));if(!n)return 0;const f=Math.ceil((5+n*3)/5)*5;return f*S.full+Math.ceil(f/2/5)*5*S.half};
const fmt=d=>{const m=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],p=n=>String(n).padStart(2,"0");let h=d.getHours(),a=h>=12?"PM":"AM";h=h%12||12;return `${p(d.getDate())} ${m[d.getMonth()]}, ${String(d.getFullYear()).slice(2)} | ${p(h)}:${p(d.getMinutes())} ${a}`};
const logo=`<svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="96" fill="#fff" stroke="#222" stroke-width="2"/><circle cx="100" cy="100" r="80" fill="none" stroke="#222" stroke-dasharray="14 8" stroke-width="2"/><rect x="52" y="72" width="96" height="56" rx="12" fill="#21964f"/><rect x="62" y="82" width="30" height="20" rx="3" fill="#fff"/><rect x="100" y="82" width="38" height="20" rx="3" fill="#fff"/><circle cx="76" cy="132" r="8" fill="#222"/><circle cx="126" cy="132" r="8" fill="#222"/><text x="100" y="168" font-size="20" font-weight="700" text-anchor="middle" fill="#c8262d" font-family="sans-serif">CITYBUS</text><text x="100" y="52" font-size="13" text-anchor="middle" fill="#444" font-family="sans-serif">DEMO TRANSIT</text></svg>`;
function qr(seed){let h=0;for(const c of seed)h=(h*31+c.charCodeAt(0))>>>0;const n=25,r=()=>(h=(h*1664525+1013904223)>>>0)/4294967296;let o=`<svg viewBox="0 0 ${n} ${n}" width="240" height="240" shape-rendering="crispEdges"><rect width="${n}" height="${n}" fill="#fff"/>`;const fin=(x,y)=>o+=`<rect x="${x}" y="${y}" width="7" height="7" fill="#000"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3" fill="#000"/>`;for(let y=0;y<n;y++)for(let x=0;x<n;x++){const inF=(x<8&&y<8)||(x>n-9&&y<8)||(x<8&&y>n-9);if(!inF&&r()>.5)o+=`<rect x="${x}" y="${y}" width="1" height="1"/>`}fin(0,0);fin(n-7,0);fin(0,n-7);return o+"</svg>"}
function nav(){return `<nav><button class="${S.tab=="home"?"on":""}" data-go="home">🏠<br>Home</button><button data-go="buses">📍<br>Buses</button><button data-go="help">❓<br>Help</button></nav>`}
function home(){return `<header><div class="logo">CB</div><span style="font-size:26px">👤</span></header><div class="demo-bar">Demo app – tickets are not valid for travel</div><main>
<div class="search"><div>🔍 Where do you want to go?</div></div>
<div class="grid2"><button class="tile" data-go="buy"><i>🎫</i>Bus Ticket</button><button class="tile" data-go="na"><i>🪪</i>Daily Pass</button></div>
<div class="grid4"><button class="tile" data-go="tickets"><i>🎟️</i>View Ticket</button><button class="tile" data-go="na"><i>🎟️</i>View Pass</button><button class="tile" data-go="na"><i>🔀</i>Route Timetable</button><button class="tile" data-go="na"><i>🚇</i>Metro Ticket</button></div>
<h3>Near Me <u style="font-size:14px;font-weight:400">Show all</u></h3>
<div class="stop"><div class="t"><span>🚌 Alpana Talkies Bus Stop</span><span>183 m</span></div>
<div class="row"><span class="no">174</span><span>Moledina Stand</span><span class="eta">15 min</span></div>
<div class="row"><span class="no">202</span><span>Ganpati Matha</span><span class="eta">7 min</span></div>
<div class="t" style="justify-content:center;font-size:14px">See More Buses</div></div>
<h3>Nearby</h3><div class="map">${[[20,25,"42"],[45,18,"29"],[60,40,"148"],[30,55,"111"],[70,65,"202"],[15,75,"94"],[50,70,"5"],[80,25,"357"]].map(p=>`<b style="left:${p[0]}%;top:${p[1]}%">${p[2]}</b>`).join("")}</div>
<p style="text-align:center;color:var(--mute);font-size:12px;margin-top:20px">Sample data only · CityBus demo</p></main>${nav()}`}
function buy(){const R=ROUTES[S.route],st=R?R.stops:[],f=fareOf(),ok=S.route&&S.from&&S.to&&f>0;
const opt=(a,sel)=>a.map(x=>`<option ${x==sel?"selected":""}>${x}</option>`).join("");
return `<div class="top"><button data-go="home" aria-label="Back">←</button><b>Ticket Details</b><span id="cd">${S.secs>=0?"":""}</span></div><main style="padding:0"><div class="tkt"><div class="h">${fmt(new Date())}</div><div class="b">
<label for="r">Route</label><select id="r"><option value="">Select or enter route</option>${Object.keys(ROUTES).map(k=>`<option value="${k}" ${k==S.route?"selected":""}>${k} towards ${ROUTES[k].to}</option>`).join("")}</select>
<label for="a">Starting stop</label><select id="a" ${R?"":"disabled"}><option value="">Enter starting stop</option>${opt(st,S.from)}</select>
<label for="b">Ending stop</label><select id="b" ${S.from?"":"disabled"}><option value="">Enter ending stop</option>${opt(st.filter(x=>x!=S.from),S.to)}</select>
<div class="seg"><button class="${S.mode=="fare"?"on":""}" data-mode="fare">By Fare</button><button class="${S.mode=="stop"?"on":""}" data-mode="stop">By Ending stop</button></div>
<div class="price">Ticket Price: ${f?"₹"+f:"–"}</div>
<div class="qty"><span>Full</span><div><button data-q="full-">−</button><output>${S.full}</output><button data-q="full+">+</button></div></div>
<div class="qty"><span>Half</span><div><button data-q="half-">−</button><output>${S.half}</output><button data-q="half+">+</button></div></div>
</div></div></main><button class="pay" id="pay" ${ok?"":"disabled"}>Pay</button>`}
function paying(){return `<div class="top"><button data-go="buy">←</button><b>Payment</b></div><main><div class="tkt"><div class="h">Mock payment</div><div class="b"><p>Amount: <b>₹${fareOf()}</b></p><p style="color:#666;font-size:14px">No real payment happens here. Connect your own payment gateway in <code>onPaymentSuccess()</code> in the code.</p><button class="pay" style="margin:12px 0;width:100%" id="ok">Simulate successful payment</button></div></div></main>`}
function onPaymentSuccess(){const now=new Date(),id=now.toISOString().slice(2,10).replace(/-/g,"")+"DEMO"+Math.random().toString(36).slice(2,8).toUpperCase();
const t={id,route:S.route,from:S.from,to:S.to,fare:fareOf(),full:S.full,half:S.half,at:now.getTime(),until:now.getTime()+3600000};S.tickets.unshift(t);save();S.sel=t;S.view="ticket"}
function tickets(){return `<div class="top"><button data-go="home">←</button><b>All tickets</b></div><main><div class="list">${S.tickets.length?S.tickets.map((t,i)=>`<div class="it" data-t="${i}"><div><b>Route ${t.route}</b><br>${t.from} → ${t.to}</div><div><b>₹${t.fare}</b></div></div>`).join(""):'<p class="empty">No tickets yet. Buy one from Bus Ticket.</p>'}</div></main>`}
function ticket(){const t=S.sel;return `<main><div class="tv"><div class="tvt"><button data-go="tickets" style="border:0;background:none;font-size:20px">✕</button><span>Need Help? &nbsp; All tickets</span></div>
<div class="card"><div class="wm">DEMO<br>NOT VALID</div><div class="hd">Demo City Transit</div><div class="bd">
<div class="f"><span>Route</span><span>Tickets count</span><span>Fare</span></div><div class="f"><span class="big">${t.route}</span><span class="big">${t.full+t.half}</span><span class="big">₹${t.fare}</span></div>
<div class="path"><span>${t.from}</span><span>⟶</span><span>${t.to}</span></div><div class="sep"></div>
<div class="f"><span>Booking Time</span><span>Validity Time</span></div><div class="f"><b style="color:#111">${fmt(new Date(t.at))}</b><b style="color:#111">${fmt(new Date(t.until))}</b></div>
<p style="text-align:center;margin:14px 0 0;color:#333">${t.id}</p><div class="sep"></div>
<div class="stamp" aria-label="Animated logo">${logo}</div><div class="exp" id="exp"></div></div></div>
<button class="qrb" id="qrb">Show QR code</button></div></main>`}
function render(){let h;const v=S.view;
 if(v=="home")h=home();else if(v=="buy")h=buy();else if(v=="pay")h=paying();else if(v=="tickets")h=tickets();else if(v=="ticket")h=ticket();
 else h=`<header><div class="logo">CB</div></header><main><p class="empty">${v=="buses"?"Buses":v=="help"?"Help":"This feature"} is not included in the demo.</p></main>${nav()}`;
 app.innerHTML=h;clearInterval(S.timer);
 if(v=="ticket"){const e=$("#exp"),tick=()=>{const s=Math.max(0,Math.floor((S.sel.until-Date.now())/1000)),p=n=>String(n).padStart(2,"0");e.textContent=s?`Expires in ${p(Math.floor(s/3600))}:${p(Math.floor(s%3600/60))}:${p(s%60)}`:"Expired"};tick();S.timer=setInterval(tick,1000)}
}
app.addEventListener("click",e=>{const g=e.target.closest("[data-go]"),m=e.target.closest("[data-mode]"),q=e.target.closest("[data-q]"),t=e.target.closest("[data-t]");
 if(g){const d=g.dataset.go;if(d=="buy"){Object.assign(S,{route:"",from:"",to:"",full:1,half:0,mode:"stop"})}S.view=d=="na"?"na":d;render()}
 else if(m){S.mode=m.dataset.mode;render()}
 else if(q){const[k,o]=[q.dataset.q.slice(0,-1),q.dataset.q.slice(-1)];S[k]=Math.max(k=="full"&&S.half==0?1:0,Math.min(6,S[k]+(o=="+"?1:-1)));if(S.full+S.half<1)S.full=1;render()}
 else if(t){S.sel=S.tickets[+t.dataset.t];S.view="ticket";render()}
 else if(e.target.id=="pay"){S.view="pay";render()}
 else if(e.target.id=="ok"){onPaymentSuccess();render()}
 else if(e.target.id=="qrb"){const d=document.createElement("div");d.className="modal";d.innerHTML=`<div>${qr(S.sel.id)}<p style="font-size:13px;color:#a00;margin:8px 0">Demo QR – not scannable</p><button class="qrb" id="cl">Close</button></div>`;app.appendChild(d)}
 else if(e.target.id=="cl"){e.target.closest(".modal").remove()}
});
app.addEventListener("change",e=>{const i=e.target.id;if(i=="r"){S.route=e.target.value;S.from=S.to="";render()}else if(i=="a"){S.from=e.target.value;S.to="";render()}else if(i=="b"){S.to=e.target.value;render()}});
render();
if("serviceWorker" in navigator && location.protocol.startsWith("http")){try{navigator.serviceWorker.register("sw.js")}catch(e){}}
</script></body></html>
